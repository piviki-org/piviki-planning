# epic-soft-open: planned stories in build order; the stories after 2 are planned when the epic is refined

[[entry]]
id = 1
type = "story"
title = "Production starts on OVH"
description = "A founder orders one OVH VPS-1, month to month, in an EU data centre, and the piviki-infra bootstrap sets it up with the environment name production; production secrets are created new in Bitwarden's production collection and the GitHub Environment production; tofu/prod adds production's own Tunnel, Access on admin.piviki.fi and ssh-prod.piviki.fi; a manual workflow run naming production deploys a commit tag with the PVK barcode prefix, the backup service on and the test recipient allowlist off; the first librarian is seeded over SSH before the admin and api records exist; until the soft open production has no patron site, noindex on every host and CORS and CSRF lists holding only https://admin.piviki.fi, checked on every deploy; the first nightly dump runs, the heartbeat is checked, and a restore drill runs on the production host from a dump holding a check title, copy and image; a password reset is sent from piviki.fi; the check records are then deleted, their barcodes never reissued."
verify = "A founder passes Access and signs in at admin.piviki.fi on an image deployed by a manual workflow run naming production; api.piviki.fi/api/v1/health answers while any other api path returns 404; the deploy checks show first-register returning 404, one Tunnel connector, noindex on every host and only the admin origin; an outside scan of the VPS shows only SSH and the hardening checks pass; core refuses to start with the TST prefix; a nightly dump lands and skipping one raises the heartbeat alert; the restore drill restores the check title, copy and image with the barcode sequence advanced by its margin; a reset email arrives from an @piviki.fi address with SPF, DKIM and DMARC passing; the production catalogue then holds no check records; piviki.fi still shows the coming-soon page."
covers = []
after = ["1.7", "1.8", "1.9", "1.15"]
hitl = true # a founder orders the VPS, creates the production secrets and deploy service token, seeds the first librarian, runs the outside scan and the restore drill with the offline key
risk = "high"
references = ["_bmad-output/initiative-kirjasto-mvp/architecture-piviki/architecture-piviki.md#ad-17-deployment-and-operations"]

[[entry]]
id = 2
type = "story"
title = "The initial collection is imported into production"
description = "A founder creates production's import API key on a librarian account and production's Access service token, runs epic-initial-load's script once against production with the founder-checked scans, a librarian reviews, merges and publishes every draft in the production review view, and the key and token are revoked when no draft from the run is left."
verify = "The production review view shows no draft from the run, no draft title without a copy and no image attached to no title; the published count matches the trial import's on test; every imported copy has a PVK barcode; the import key and service token no longer sign in."
covers = []
after = [1, "epic-initial-load"]
hitl = true # a founder creates and revokes the key and token and runs the import; a librarian reviews every record
risk = "high"
