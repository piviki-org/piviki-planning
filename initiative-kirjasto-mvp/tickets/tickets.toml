[[epic]]
id = 1
slug = "epic-librarian-catalogue"
title = "Librarians keep the catalogue"
description = "On the test environment, a librarian adds and edits books and donated copies in an English tool built for translation, with every record owned by the Piviki tenant and its policy values in place, and the platform, backups, hardening and mail are ready for the production start."
covers = ["R11", "R13", "R17", "R20", "R22", "R25"]

[[epic]]
id = 2
slug = "epic-initial-load"
title = "The initial collection is ready to import"
description = "The import script turns the founder-checked scans of the initial collection, about 300 books, into draft records with diacritics intact, and a full trial import has been reviewed and published on test."
covers = ["R13"]
after = [{ epic = 1, needs = "the record format and review view, the import API key and Access service-token setup (1.6)" }]

[[epic]]
id = 3
slug = "epic-patron-site"
title = "Parents find books and sign up"
description = "On the test site, test.piviki.fi, anyone browses and searches in Vietnamese or English, and an adult signs up and is invited to the chat group, and a librarian can link a consenting patron as a copy's donor."
covers = ["R1", "R2", "R3", "R16", "R17"]
after = [{ epic = 1, needs = "catalogue records and the tenant model" }]

[[epic]]
id = 7
slug = "epic-soft-open"
title = "Piviki soft opens"
description = "Production runs on OVH with the initial collection imported and published, and piviki.fi serves the patron website in place of the coming-soon page; sign-up is open to anyone once the privacy notice, usage policy and processor agreements exist, else the site is browse-only with a founder pilot."
covers = ["R13", "R19", "R21"]
after = [{ epic = 1, needs = "backups, hardening, mail and the host-infrastructure layout (1.7, 1.8, 1.9, 1.15) for the production start" }, { epic = 2, needs = "the import script and a reviewed trial import, for the real import" }, { epic = 3, needs = "the patron site, for the piviki.fi switch and sign-up" }]

[[epic]]
id = 4
slug = "epic-reservation-loop"
title = "A book goes from reservation to return"
description = "A patron reserves or queues, gets the ready email and sees it on their account; a librarian takes it through pickup and return, handles uncollected reservations and adds phone numbers; the overdue block holds."
covers = ["R4", "R5", "R7", "R8", "R14", "R15", "R18", "R24"]
after = [{ epic = 3, needs = "patron accounts and the catalogue pages" }, { epic = 7, needs = "the production patron site at piviki.fi" }]

[[epic]]
id = 5
slug = "epic-loan-care"
title = "Loans are renewed and reminded"
description = "Patrons renew online within the rules, and get due-date reminders and weekly overdue notices; librarians can fill a book record by ISBN lookup."
covers = ["R6", "R9", "R10", "R12"]
after = [{ epic = 4, needs = "loans with due dates and the email sending" }]

[[epic]]
id = 6
slug = "epic-launch"
title = "Piviki opens"
description = "Retention and inactivity deletion apply, a librarian can delete an account and mark held copies lost, the success signals can be read, and the first real loan is made."
covers = ["R19", "R23"]
after = [{ epic = 4, needs = "loans and reservations to delete, cancel and mark lost" }, { epic = 5, needs = "the finished or deliberately cut loan rules, since both change loan code" }, { epic = 7, needs = "sign-up open to real patrons, for the first real loan" }]
