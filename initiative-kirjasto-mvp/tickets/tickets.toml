[[epic]]
id = 1
slug = "epic-librarian-catalogue"
title = "Librarians keep the catalogue"
description = "On the deployed platform, a librarian adds and edits books and donated copies in an English tool built for translation, with every record owned by the Piviki tenant and its policy values in place."
covers = ["R11", "R17", "R20", "R22", "R25"]

[[epic]]
id = 2
slug = "epic-initial-load"
title = "The initial collection is imported"
description = "The initial collection of about 300 books is in the live catalogue, created from scans by a script and reviewed by a librarian before bulk import."
covers = ["R13"]
after = [{ epic = 1, needs = "the catalogue record format and the librarian tool to review in" }]

[[epic]]
id = 3
slug = "epic-patron-site"
title = "Parents find books and sign up"
description = "On the deployed site, not yet at piviki.fi, anyone browses and searches in Vietnamese or English, and an adult signs up and is invited to the chat group, and a librarian can link a consenting patron as a copy's donor."
covers = ["R1", "R2", "R3", "R16", "R17"]
after = [{ epic = 1, needs = "catalogue records and the tenant model" }]

[[epic]]
id = 4
slug = "epic-reservation-loop"
title = "A book goes from reservation to return"
description = "A patron reserves or queues, gets the ready email and sees it on their account; a librarian takes it through pickup and return, handles uncollected reservations and adds phone numbers; the overdue block holds."
covers = ["R4", "R5", "R7", "R8", "R14", "R15", "R18", "R24"]
after = [{ epic = 3, needs = "patron accounts and the catalogue pages" }]

[[epic]]
id = 5
slug = "epic-loan-care"
title = "Loans are renewed and reminded"
description = "Patrons renew online within the rules, and get due-date reminders and weekly overdue notices; librarians can fill a book record by ISBN lookup."
covers = ["R6", "R9", "R10", "R12"]
after = [{ epic = 4, needs = "loans with due dates and the email sending" }]

[[epic]]
id = 6
slug = "epic-launch"
title = "Piviki opens"
description = "Privacy notice, usage policy, retention, account deletion and lost copies are live, the GDPR check is answered, the success signals can be read, piviki.fi serves the patron website, and the first real loan is made."
covers = ["R19", "R21", "R23"]
after = [{ epic = 4, needs = "loans and reservations to delete, cancel and mark lost" }, { epic = 5, needs = "the finished or deliberately cut loan rules, since both change loan code" }]
